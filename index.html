<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Simulador de Tampinhas</title>

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
        <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.4/jquery.min.js"></script>
        <link rel="stylesheet" href="styles.css">
        <script src="script.js"></script>
    </head>

    <body>
        <!-- Modal de Alertas -->
        <div id="alert-modal" class="modal-overlay hidden">
            <div class="modal-container">
                <div class="modal-content">
                    <p id="alert-message" class="modal-message"></p>
                    <button id="alert-button" class="btn-modal-close">OK</button>
                </div>
            </div>
        </div>

        <div class="container-app">
            <!-- Header -->
            <div class="header">
                <img src="LOGO.png" alt="Costelinha FC" class="site-logo" style="
    width: 120px;
    height: 120px;
    border-radius: 50%;
">
                <button type="button" id="settings-menu-toggle" class="hamburger-button" aria-label="Abrir configurações do sorteio" aria-controls="settings-menu" aria-expanded="false">
                    <span></span>
                    <span></span>
                    <span></span>
                    <i id="settings-indicator" class="settings-indicator is-active" aria-hidden="true"></i>
                </button>
                <h1 class="title">Sorteio Costelinha</h1>
                
            </div>

            <!-- Draw Settings -->
            <div id="settings-menu" class="card settings-menu hidden">
                <div class="card-header">
                    <h2 class="section-title">Configurações do Sorteio</h2>
                </div>
                <div class="card-body settings-menu-content">
                    <button type="button" id="first-round-balancing-toggle" class="feature-toggle is-active" aria-pressed="false">
                        <span class="feature-toggle-copy">
                            <span class="feature-toggle-title">Primeira rodada balanceada</span>
                            <span class="feature-toggle-description">Garante um jogador por time antes de repetir uma cor.</span>
                        </span>
                        <span id="first-round-balancing-status" class="feature-toggle-status">Desativado</span>
                    </button>
                </div>
            </div>

            <!-- Input Section -->
            <div class="card card-input">
                <div class="card-header">
                    <h2 class="section-title">Configuração</h2>
                </div>
                <div class="card-body">
                    <div class="input-group-custom">
                        <label for="players" class="label-input">Total de jogadores</label>
                        <input type="number" id="players" class="input-field" placeholder="12" min="1" aria-describedby="players-help">
                        <small id="players-help" class="helper-text">Mínimo 1 jogador</small>
                    </div>

                    <div class="input-group-custom">
                        <label for="playersPerTeam" class="label-input">Jogadores por time</label>
                        <input type="number" id="playersPerTeam" class="input-field" placeholder="4" min="1" aria-describedby="team-help">
                        <small id="team-help" class="helper-text">Mínimo 1 jogador por time (máx. 9 times)</small>
                    </div>

                    <button type="button" class="btn-primary" id="calculate">
                        <span>Calcular Número de Times</span>
                    </button>
                </div>
            </div>

            <!-- Teams Selection -->
            <div id="teams-section" class="teams-section hidden">
                <div class="card card-teams">
                    <div class="card-header">
                        <h2 class="section-title">Escolha os Times</h2>
                        <p id="lbl_select" class="subtitle-small"></p>
                    </div>
                    <div class="card-body">
                        <div class="colors-grid">
                            <label class="cap green" for="cap_green" aria-label="Tampinha verde">
                                <input name="chk" id="cap_green" type="checkbox" data="green">
                                <span class="checkmark"></span>
                            </label>
                            <label class="cap blue" for="cap_blue" aria-label="Tampinha azul">
                                <input name="chk" id="cap_blue" type="checkbox" data="blue">
                                <span class="checkmark"></span>
                            </label>
                            <label class="cap pink" for="cap_pink" aria-label="Tampinha rosa">
                                <input name="chk" type="checkbox" id="cap_pink" data="pink">
                                <span class="checkmark chk-black"></span>
                            </label>
                            <label class="cap red" for="cap_red" aria-label="Tampinha vermelha">
                                <input name="chk" type="checkbox" id="cap_red" data="red">
                                <span class="checkmark"></span>
                            </label>
                            <label class="cap yellow" for="cap_yellow" aria-label="Tampinha amarela">
                                <input name="chk" type="checkbox" id="cap_yellow" data="yellow">
                                <span class="checkmark chk-black"></span>
                            </label>
                            <label class="cap purple" for="cap_purple" aria-label="Tampinha roxa">
                                <input name="chk" type="checkbox" id="cap_purple" data="purple">
                                <span class="checkmark"></span>
                            </label>
                            <label class="cap orange" for="cap_orange" aria-label="Tampinha laranja">
                                <input name="chk" type="checkbox" id="cap_orange" data="orange">
                                <span class="checkmark chk-black"></span>
                            </label>
                            <label class="cap black" for="cap_black" aria-label="Tampinha preta">
                                <input name="chk" type="checkbox" id="cap_black" data="black">
                                <span class="checkmark"></span>
                            </label>
                            <label class="cap greenyellow" for="cap_greenyellow" aria-label="Tampinha verde-amarela">
                                <input name="chk" type="checkbox" id="cap_greenyellow" data="greenyellow">
                                <span class="checkmark chk-black"></span>
                            </label>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Draw Section -->
            <div id="draw-section" class="draw-section hidden">
                <div class="draw-dashboard">
                <div class="card card-draw">
                    <div class="card-header">
                        <h3 class="section-title">Sorteio</h3>
                    </div>
                    <div class="card-body">
                        <div class="draw-container">
                            <div class="sort_result">
                                <div id="sorted_color" class="cap-result"></div>
                            </div>
                            <button type="button" class="btn-secondary" id="btn_sort">
                                <span>Sortear Próximo</span>
                            </button>
                        </div>
                    </div>
                </div>

                <!-- History Status -->
                <div class="card card-history">
                    <div class="card-header">
                        <h3 class="section-title">Sorteados</h3>
                    </div>
                    <div class="card-body">
                        <div id="status" class="status-list"></div>
                    </div>
                </div>
                </div>
            </div>

            <!-- Teams List -->
            <div id="teams-list-section" class="teams-list-section hidden">
                <div class="card card-list">
                    <div class="card-header">
                        <h2 class="section-title">Vagas por Time</h2>
                    </div>
                    <div class="card-body">
                        <div class="spots">
                            <ul id="list-spots" class="teams-list"> </ul>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Footer -->
        <footer class="footer">
            <a href="https://github.com/MatheusRod0296/Simulador-de-tampinhas" target="_blank" rel="noopener noreferrer" class="footer-link" title="Ver no GitHub">
                <svg class="github-icon" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                    <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 . .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.003 12.003 0 0024 12c0-6.63-5.37-12-12-12z"/>
                </svg>
                <span>GitHub</span>
            </a>
        </footer>

    </body>
</html>
